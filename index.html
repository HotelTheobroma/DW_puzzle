  :root { --void:#07040f; --water:#7fd6ff; --glow:#b48cff; --stone:#2a2238; --stone-hi:#3b3150; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { background: radial-gradient(ellipse at 50% 35%, #1d1035 0%, var(--void) 70%) fixed; color: #e6dcff;
         font-family: "Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
         display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
         min-height: 100vh; padding: 24px 16px; overflow-x: hidden; }
  .shards { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  .shard { position: absolute; background: linear-gradient(135deg,#2b1d48,#0e0819); border: 1px solid #3a2a5c; opacity: .55;
           clip-path: polygon(10% 0,100% 20%,80% 100%,0 70%); animation: drift 18s ease-in-out infinite alternate; }
  @keyframes drift { from { transform: translateY(0) rotate(var(--r)); } to { transform: translateY(-26px) rotate(calc(var(--r) + 14deg)); } }

  .wall { position: relative; z-index: 1; width: min(460px, 100%); width: min(460px, 100%, max(280px, 100dvh - 120px)); aspect-ratio: 1; padding: 7%;
          background: radial-gradient(circle at 30% 20%, rgba(180,140,255,.10), transparent 50%), linear-gradient(160deg,#1a1230,#0d0819);
          border: 1px solid #3c2b63; box-shadow: inset 0 0 60px rgba(108,63,196,.25);
          clip-path: polygon(3% 1%,40% 0,62% 2%,98% 0,100% 35%,97% 70%,100% 99%,60% 100%,30% 98%,0 100%,2% 60%,0 25%); }
  .crack { position: absolute; background: #3d2c63; height: 1px; transform-origin: left; opacity: .7; }
  .board { position: relative; width: 100%; height: 100%; }
  .slot { position: absolute; border-radius: 10px; background: #0a0614; box-shadow: inset 0 0 0 1px #2c2147, inset 0 4px 12px rgba(0,0,0,.8); }
  .slot.empty { background: radial-gradient(circle, rgba(127,214,255,.20), rgba(60,80,160,.08) 70%), #0a0614; }
  .slot.empty::after { content: ''; position: absolute; inset: 18%; border-radius: 50%; border: 1px solid rgba(127,214,255,.25); animation: ripple 3s ease-out infinite; }
  @keyframes ripple { from { transform: scale(.6); opacity: .9; } to { transform: scale(1.2); opacity: 0; } }
  svg.flow { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .flow-base { fill: none; stroke: #241a3b; stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; }
  .flow-water { fill: none; stroke: var(--water); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; transition: stroke-dashoffset .8s ease; }
  .tile { position: absolute; border-radius: 10px; cursor: default; user-select: none; display: flex; align-items: center; justify-content: center;
          background: linear-gradient(150deg, var(--stone-hi), var(--stone) 60%, #1d1729);
          box-shadow: 0 6px 14px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.08), inset 0 0 0 1px #4a3c66;
          transition: left .18s ease, top .18s ease, box-shadow .3s; }
  .tile::before { content: ''; position: absolute; inset: 0; border-radius: 10px; pointer-events: none;
                  background: linear-gradient(115deg, transparent 46%, rgba(0,0,0,.35) 47%, transparent 49%),
                              linear-gradient(35deg, transparent 70%, rgba(0,0,0,.3) 71%, transparent 73%); }
  .tile.movable { cursor: pointer; }
  @media (hover: none) { .tile.movable { box-shadow: 0 6px 14px rgba(0,0,0,.6), 0 0 8px rgba(180,140,255,.35), inset 0 0 0 1px rgba(180,140,255,.6); } }
  @media (hover: hover) { .tile.movable:hover { box-shadow: 0 6px 18px rgba(0,0,0,.6), 0 0 14px rgba(180,140,255,.55), inset 0 0 0 1px var(--glow); } }
  .glyph { font-family: 'UnownGlyph'; font-size: clamp(34px, 12vw, 64px); line-height: 1; color: #d9c9ff;
           text-shadow: 0 0 8px rgba(180,140,255,.7); pointer-events: none; }
  .tile.lit { box-shadow: 0 0 20px rgba(127,214,255,.7), inset 0 0 0 2px var(--water); }
  .tile.lit .glyph { color: #dff6ff; text-shadow: 0 0 10px rgba(127,214,255,1); }
  button { position: relative; z-index: 1; background: linear-gradient(180deg,#5b3aa8,#3b2378); color: #f1eaff; border: 1px solid #8f6be0;
           border-radius: 8px; padding: 10px 18px; font-size: 14px; cursor: pointer; }
  button:hover { box-shadow: 0 0 10px rgba(180,140,255,.45); }

  html { -webkit-text-size-adjust: 100%; }
  body { min-height: 100dvh; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
  button, .tile, nav button { touch-action: manipulation; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  canvas { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  @media (hover: none) {
    button.act:hover { border-color: #4a3a72; box-shadow: none; }
    button.save:hover { border-color: #8f6be0; }
    button:hover { box-shadow: none; }
    button:active, button.act:active { filter: brightness(1.35); }
  }
  @media (max-width: 560px) {
    body { padding: 12px 10px 28px; gap: 12px; }
    button.act { padding: 12px 16px; font-size: 15px; min-width: 52px; min-height: 48px; }
    .pad { grid-template-columns: repeat(3, 62px); gap: 6px; }
    .pad button { min-height: 58px; font-size: 22px; padding: 0; }
  }
  #saveSheet { position: fixed; inset: 0; z-index: 99; background: rgba(4,2,10,.88); display: flex; flex-direction: column;
               align-items: center; justify-content: center; gap: 14px; padding: 20px; }
  #saveSheet img { max-width: min(92vw, 560px); max-height: 68dvh; border-radius: 8px; box-shadow: 0 0 24px rgba(180,140,255,.35);
                   -webkit-touch-callout: default; -webkit-user-select: auto; user-select: auto; }
  #saveSheet p { margin: 0; font-size: 14px; color: #cfc2ee; text-align: center; }
  #saveSheet .btns { display: flex; gap: 8px; }
  #saveSheet button { background: #1c1430; color: #e6dcff; border: 1px solid #4a3a72; border-radius: 8px; padding: 12px 18px; font-size: 15px; }
</style>
</head>
<body>
<div class="shards" id="shards"></div>
<div class="wall" id="wall"><div class="board" id="board"></div></div>
<button onclick="saveImage()">이미지로 저장</button>

<script>

const COARSE = matchMedia('(pointer: coarse)').matches;
function deliver(blob, name) {
  if (!COARSE) {
    const url = URL.createObjectURL(blob), a = document.createElement('a'); a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 2000); return;
  }
  const url = URL.createObjectURL(blob), file = new File([blob], name, { type: 'image/png' });
  const box = document.createElement('div'); box.id = 'saveSheet';
  const canShare = !!(navigator.canShare && navigator.canShare({ files: [file] }));
  box.innerHTML = '<img alt=""><p>이미지를 길게 눌러 저장하세요.</p><div class="btns">' +
    (canShare ? '<button data-k="share">공유 · 저장</button>' : '<button data-k="dl">내려받기</button>') + '<button data-k="x">닫기</button></div>';
  box.querySelector('img').src = url;
  box.addEventListener('click', e => {
    const k = e.target.dataset && e.target.dataset.k;
    if (k === 'share') navigator.share({ files: [file] }).catch(() => {});
    else if (k === 'dl') { const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); }
    else if (k === 'x' || e.target === box) { box.remove(); URL.revokeObjectURL(url); }
  });
  document.body.appendChild(box);
}
const START = ['H','N','O','_','A','P','N','E','D'];
const GOAL  = ['O','P','E','N','H','A','N','D','_'];
let state = START.slice();
const P = 34.667, W = 30.667;   

(function () {
  const box = document.getElementById('shards');
  for (let i = 0; i < 14; i++) {
    const s = document.createElement('div'); s.className = 'shard'; const w = 20 + Math.random() * 70;
    s.style.width = w + 'px'; s.style.height = w * (0.5 + Math.random()) + 'px';
    s.style.left = Math.random() * 100 + '%'; s.style.top = Math.random() * 100 + '%';
    s.style.setProperty('--r', (Math.random() * 360) + 'deg'); s.style.animationDuration = (12 + Math.random() * 14) + 's';
    box.appendChild(s);
  }
  const wall = document.getElementById('wall');
  for (let i = 0; i < 5; i++) {
    const c = document.createElement('div'); c.className = 'crack';
    c.style.left = Math.random() * 90 + '%'; c.style.top = Math.random() * 95 + '%'; c.style.width = 20 + Math.random() * 60 + 'px';
    c.style.transform = 'rotate(' + Math.random() * 180 + 'deg)'; wall.appendChild(c);
  }
})();

const solved = () => state.every((v, i) => v === GOAL[i]);
function canMove(i) {
  const e = state.indexOf('_');
  return Math.abs(Math.floor(i / 3) - Math.floor(e / 3)) + Math.abs(i % 3 - e % 3) === 1;
}
function slide(i) {
  if (solved() || !canMove(i)) return;
  const e = state.indexOf('_'); [state[i], state[e]] = [state[e], state[i]]; render();
}
function render() {
  const board = document.getElementById('board'); board.innerHTML = ''; const done = solved();
  for (let i = 0; i < 9; i++) {
    const s = document.createElement('div'); s.className = 'slot' + (state[i] === '_' ? ' empty' : '');
    s.style.left = (i % 3) * P + '%'; s.style.top = Math.floor(i / 3) * P + '%'; s.style.width = s.style.height = W + '%';
    board.appendChild(s);
  }
  const pts = [...Array(9).keys()].map(i => [(i % 3) * P + W / 2, Math.floor(i / 3) * P + W / 2]);
  const d = 'M' + pts.map(p => p.join(' ')).join(' L');
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); svg.setAttribute('class', 'flow'); svg.setAttribute('viewBox', '0 0 100 100');
  svg.innerHTML = '<path class="flow-base" d="' + d + '"/><path class="flow-water" d="' + d + '"/>';
  board.appendChild(svg);
  const water = svg.querySelector('.flow-water'); const total = water.getTotalLength();
  water.style.strokeDasharray = total; water.style.strokeDashoffset = total * (done ? 0 : 0.97);
  state.forEach((L, i) => {
    if (L === '_') return;
    const t = document.createElement('div'); t.className = 'tile' + (done ? ' lit' : (canMove(i) ? ' movable' : ''));
    t.style.left = (i % 3) * P + '%'; t.style.top = Math.floor(i / 3) * P + '%'; t.style.width = t.style.height = W + '%';
    t.innerHTML = '<span class="glyph">' + L + '</span>'; t.onclick = () => slide(i); board.appendChild(t);
  });
}
document.addEventListener('keydown', e => {
  const k = { ArrowUp: -3, ArrowDown: 3, ArrowLeft: -1, ArrowRight: 1 }[e.key]; if (k === undefined) return;
  e.preventDefault(); const em = state.indexOf('_'), from = em - k;
  if (from < 0 || from > 8) return;
  if ((k === 1 || k === -1) && Math.floor(from / 3) !== Math.floor(em / 3)) return;
  slide(from);
});

async function saveImage() {
  await document.fonts.load('100px UnownGlyph');
  const S = 900, pad = 80, gap = 22, cell = (S - pad * 2 - gap * 2) / 3;
  const cv = document.createElement('canvas'); cv.width = S; cv.height = S; const g = cv.getContext('2d'); const done = solved();
  const bg = g.createRadialGradient(S / 2, S * .4, 40, S / 2, S * .4, S * .8); bg.addColorStop(0, '#1d1035'); bg.addColorStop(1, '#07040f');
  g.fillStyle = bg; g.fillRect(0, 0, S, S);
  for (let i = 0; i < 16; i++) {
    g.save(); g.translate(Math.random() * S, Math.random() * S); g.rotate(Math.random() * 6.28);
    g.fillStyle = 'rgba(43,29,72,.6)'; g.strokeStyle = 'rgba(58,42,92,.8)'; const w = 15 + Math.random() * 45;
    g.beginPath(); g.moveTo(0, 0); g.lineTo(w, w * .2); g.lineTo(w * .8, w); g.lineTo(0, w * .7); g.closePath(); g.fill(); g.stroke(); g.restore();
  }
  g.fillStyle = '#140d26'; g.strokeStyle = '#3c2b63'; g.lineWidth = 2;
  g.beginPath(); g.moveTo(pad - 42, pad - 34); g.lineTo(S - pad + 30, pad - 28); g.lineTo(S - pad + 40, S - pad + 36); g.lineTo(pad - 30, S - pad + 42); g.closePath(); g.fill(); g.stroke();
  const cx = i => pad + (i % 3) * (cell + gap) + cell / 2, cy = i => pad + Math.floor(i / 3) * (cell + gap) + cell / 2;
  g.lineCap = 'round'; g.lineJoin = 'round'; g.lineWidth = 8;
  g.strokeStyle = done ? '#7fd6ff' : '#241a3b'; if (done) { g.shadowColor = '#7fd6ff'; g.shadowBlur = 14; }
  g.beginPath(); for (let i = 0; i < 9; i++) (i ? g.lineTo : g.moveTo).call(g, cx(i), cy(i)); g.stroke(); g.shadowBlur = 0;
  for (let i = 0; i < 9; i++) {
    const x = pad + (i % 3) * (cell + gap), y = pad + Math.floor(i / 3) * (cell + gap), L = state[i];
    rr(g, x, y, cell, cell, 16);
    if (L === '_') {
      const wg = g.createRadialGradient(x + cell / 2, y + cell / 2, 5, x + cell / 2, y + cell / 2, cell / 2);
      wg.addColorStop(0, 'rgba(127,214,255,.35)'); wg.addColorStop(1, 'rgba(10,6,20,1)'); g.fillStyle = wg; g.fill(); continue;
    }
    const sg = g.createLinearGradient(x, y, x + cell, y + cell); sg.addColorStop(0, '#3b3150'); sg.addColorStop(.6, '#2a2238'); sg.addColorStop(1, '#1d1729');
    g.fillStyle = sg; g.fill();
    g.strokeStyle = done ? '#7fd6ff' : '#4a3c66'; g.lineWidth = done ? 4 : 2; if (done) { g.shadowColor = '#7fd6ff'; g.shadowBlur = 18; } g.stroke(); g.shadowBlur = 0;
    g.strokeStyle = 'rgba(0,0,0,.35)'; g.lineWidth = 2; g.beginPath(); g.moveTo(x + cell * .2, y + cell * .1); g.lineTo(x + cell * .45, y + cell * .55); g.lineTo(x + cell * .4, y + cell * .9); g.stroke();
    g.fillStyle = done ? '#dff6ff' : '#d9c9ff'; g.shadowColor = done ? '#7fd6ff' : 'rgba(180,140,255,.8)'; g.shadowBlur = 14;
    g.font = (cell * .55) + 'px UnownGlyph'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(L, x + cell / 2, y + cell / 2); g.shadowBlur = 0;
  }
  cv.toBlob(blob => {
    deliver(blob, 'puzzle.png');
  }, 'image/png');
}
function rr(g, x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }

document.fonts.load('40px UnownGlyph').then(render, render);
</script>
</body>
